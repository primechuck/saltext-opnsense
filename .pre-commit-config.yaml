---
minimum_pre_commit_version: 2.4.0
repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: check-merge-conflict
        args: [--assume-in-merge]
      - id: trailing-whitespace
        args: [--markdown-linebreak-ext=md]
      - id: mixed-line-ending
        args: [--fix=lf]
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-added-large-files
        args: ['--maxkb=500']

  # ----- Formatting ----->
  - repo: https://github.com/saltstack/pre-commit-remove-import-headers
    rev: e79f595c0df31b8cb152c53993ce7c3c64f07cd4  # 1.1.0
    hooks:
      - id: remove-import-headers

  - repo: https://github.com/saltstack/salt-rewrite
    rev: 2401c0faef69b6b846c719d611bcfe358234d5d1  # 2.5.2
    hooks:
      - id: salt-rewrite
        alias: rewrite-docstrings
        name: Salt extensions docstrings auto-fixes
        files: ^src/saltext/opnsense/.*\.py$
        args: [--silent]
      - id: salt-rewrite
        alias: rewrite-tests
        name: Rewrite the test suite
        files: ^tests/.*\.py$
        args: [--silent, -E, fix_docstrings]

  - repo: https://github.com/asottile/pyupgrade
    rev: v3.21.2
    hooks:
      - id: pyupgrade
        name: Rewrite code to be Py310+
        args: [--py310-plus]
        exclude: src/saltext/opnsense/version/.*\.py$

  - repo: https://github.com/PyCQA/isort
    rev: 8.0.1
    hooks:
      - id: isort
        args: [--py, "310"]
        exclude: src/saltext/opnsense/__init__.py

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.14.8
    hooks:
      - id: ruff
        args: [--fix]
        types: [python]
      - id: ruff-format
        types: [python]

  # <---- Formatting -----

  # ----- Security ------->
  - repo: https://github.com/PyCQA/bandit
    rev: 1.9.4
    hooks:
      - id: bandit
        alias: bandit-salt
        name: Run bandit against the code base
        args: [--silent, -lll, --skip, B701]
        exclude: src/saltext/opnsense/version/.*\.py$
      - id: bandit
        alias: bandit-tests
        name: Run bandit against the test suite
        args: [--silent, -lll, --skip, B701]
        files: ^tests/.*
  # <---- Security --------

  # ----- Code Analysis -->
  - repo: local
    hooks:
      - id: nox-lint
        name: Lint Source & Tests via nox
        entry: nox -e lint -- 
        language: python
        files: ^(setup|noxfile|src|tests)/.*\.py$
        require_serial: true
        additional_dependencies:
          - nox==2026.8.17
          - uv==0.12.12

# Setup:
#   pip install pre-commit
#   pre-commit install
#   pre-commit run --all-files
