---
minimum_pre_commit_version: 2.4.0
repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: check-merge-conflict
        args: [--assume-in-merge]
      - id: trailing-whitespace
        args: [--markdown-linebreak-ext=md]
      - id: mixed-line-ending
        args: [--fix=lf]
      - id: end-of-file-fixer
      - id: check-yaml
        exclude: |
          (?x)^(
            src/saltext/opnsense/utils/.*\.json|
            \.copier-answers\.yml|
            \.copier-answers\..*\.yml
          )$
      - id: check-added-large-files
        args: ['--maxkb=500']
      - id: check-json
      - id: debug-statements

  # ----- Formatting ----->
  - repo: https://github.com/saltstack/pre-commit-remove-import-headers
    rev: e79f595c0df31b8cb152c53993ce7c3c64f07cd4  # 1.1.0
    hooks:
      - id: remove-import-headers

  - repo: https://github.com/saltstack/salt-rewrite
    rev: 2401c0faef69b6b846c719d611bcfe358234d5d1  # 2.5.2
    hooks:
      - id: salt-rewrite
        alias: rewrite-docstrings
        name: Salt extensions docstrings auto-fixes
        files: ^src/saltext/opnsense/.*\.py$
        args: [--silent]
      - id: salt-rewrite
        alias: rewrite-tests
        name: Rewrite the test suite
        files: ^tests/.*\.py$
        args: [--silent, -E, fix_docstrings]

  - repo: https://github.com/asottile/pyupgrade
    rev: v3.21.2
    hooks:
      - id: pyupgrade
        name: Rewrite code to be Py310+
        args: [--py310-plus]
        exclude: src/saltext/opnsense/version/.*\.py$

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.14.8
    hooks:
      - id: ruff
        args: [--fix]
        types: [python]
      - id: ruff-format
        types: [python]

  # ----- Security ------->
  - repo: https://github.com/PyCQA/bandit
    rev: 1.9.4
    hooks:
      - id: bandit
        alias: bandit-salt
        name: Run bandit against the code base
        args: [--silent, -lll, --skip, B701]
        exclude: src/saltext/opnsense/version/.*\.py$
      - id: bandit
        alias: bandit-tests
        name: Run bandit against the test suite
        args: [--silent, -lll, --skip, B701]
        files: ^tests/.*

  # ----- Code Analysis -->
  - repo: local
    hooks:
      - id: nox-lint
        name: Lint Source & Tests via nox
        entry: nox -e lint --
        language: python
        files: ^(setup|noxfile|src|tests)/.*\.py$
        require_serial: true
        stages: [manual]
        additional_dependencies:
          - nox==2026.8.17
          - uv==0.12.12

  # ----- YAML / Salt / Workflow lint -->
  - repo: https://github.com/adrienverge/yamllint
    rev: v1.38.0
    hooks:
      - id: yamllint
        name: Check YAML syntax with yamllint
        args: [--strict]
        types: [file]
        files: |
          (?x)^(
                .*\.yaml|
                .*\.yml|
                \.salt-lint|
                \.yamllint|
                .*\.example
          )$
        exclude: |
          (?x)^(
                src/saltext/opnsense/utils/.*\.json|
                docs/tutorials/.*\.sls|
                \.copier-answers\.yml|
                \.copier-answers\..*\.yml
          )$

  - repo: https://github.com/warpnet/salt-lint
    rev: v0.9.2
    hooks:
      - id: salt-lint
        name: Check Salt files using salt-lint
        files: ^.*\.sls$

  - repo: https://github.com/python-jsonschema/check-jsonschema
    rev: 0.34.0
    hooks:
      - id: check-github-workflows
        name: Validate GitHub workflows
        args: [--verbose]

  - repo: https://github.com/shellcheck-py/shellcheck-py
    rev: v0.10.0.1
    hooks:
      - id: shellcheck
        name: Check shell scripts with shellcheck
        files: ^.*\.(sh|bash|ksh)$
        types: []

# Setup for contributors:
#   pip install pre-commit
#   pre-commit install
#   pre-commit run --all-files
