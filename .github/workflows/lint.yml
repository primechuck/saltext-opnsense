---
name: Lint

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pre-commit:
    name: Pre-commit hooks
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.11"

      - name: Cache pre-commit
        uses: actions/cache@5a3ec84eff668545956fd18022155c47e93e2684 # v4.2.3
        with:
          path: ~/.cache/pre-commit
          key: pre-commit-${{ runner.os }}-${{ hashFiles('.pre-commit-config.yaml') }}
          restore-keys: |
            pre-commit-${{ runner.os }}-

      - name: Cache pip
        uses: actions/cache@5a3ec84eff668545956fd18022155c47e93e2684 # v4.2.3
        with:
          path: ~/.cache/pip
          key: pip-${{ runner.os }}-${{ hashFiles('pyproject.toml') }}-py3.11
          restore-keys: |
            pip-${{ runner.os }}-

      - name: Install pre-commit
        run: python -m pip install --upgrade pip pre-commit

      - name: Run pre-commit hooks
        run: pre-commit run --all-files --color always --show-diff-on-failure

  yaml-lint:
    name: YAML Lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.11"

      - name: Install yamllint
        run: python -m pip install --upgrade pip yamllint==1.38.0

      - name: Run yamllint
        run: |
          if [ -f .yamllint.yaml ]; then
            yamllint -c .yamllint.yaml -s .
          else
            yamllint -s .
          fi

  salt-lint:
    name: Salt Lint (SLS)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.11"

      - name: Install salt-lint
        run: python -m pip install --upgrade pip salt-lint==0.9.2

      - name: Run salt-lint on tutorial SLS
        shell: bash
        run: |
          set -e
          shopt -s globstar nullglob
          if compgen -G "docs/tutorials/**/*.sls" > /dev/null; then
            salt-lint docs/tutorials/**/*.sls || \
              echo "::warning::salt-lint found issues (see above)"
          fi
          if [ -f pillar.example ]; then
            salt-lint pillar.example || \
              echo "::warning::pillar.example informational"
          fi

  ruff:
    name: Ruff (Python lint & format)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.11"

      - name: Cache pip
        uses: actions/cache@5a3ec84eff668545956fd18022155c47e93e2684 # v4.2.3
        with:
          path: ~/.cache/pip
          key: pip-ruff-${{ runner.os }}-${{ hashFiles('pyproject.toml') }}

      - name: Install ruff
        run: python -m pip install --upgrade pip ruff==0.14.8

      - name: Ruff check
        run: ruff check src tests tools

      - name: Ruff format --check
        run: ruff format --check src tests tools

  workflow-lint:
    name: Workflow lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.11"

      - name: Cache pip
        uses: actions/cache@5a3ec84eff668545956fd18022155c47e93e2684 # v4.2.3
        with:
          path: ~/.cache/pip
          key: pip-workflow-lint-${{ runner.os }}-py3.11

      - name: Install check-jsonschema
        run: python -m pip install --upgrade pip check-jsonschema==0.38.0

      - name: Validate GitHub workflows
        run: check-jsonschema --verbose --builtin-schema vendor.github-workflows .github/workflows/*.yml

      - name: Run actionlint
        shell: bash
        run: |
          set -e
          mkdir -p .bin
          VER=v1.7.9
          URL="https://raw.githubusercontent.com/rhysd/actionlint/main/scripts/download-actionlint.bash"
          if ! .bin/actionlint -version 2>/dev/null | grep -q "$VER"; then
            curl -sSfL "$URL" | bash -s -- "$VER" .bin
            chmod +x .bin/actionlint
          fi
          .bin/actionlint -color || echo "::warning::actionlint issues"
