name: Publish dev build to TestPyPI

# Dev release pipeline. Every push to main that passes CI is published to
# TestPyPI automatically, no tag and no approval needed. The version comes from
# setuptools_scm (e.g. 2.0.1.dev3 = third commit after v2.0.0).
# Stable releases go to PyPI via publish.yml (tag only). See docs/DEVELOPMENT.md.

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]

concurrency:
  group: publish-dev
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  publish-dev:
    name: Build and publish to TestPyPI
    if: >-
      github.repository == 'primechuck/saltext-opnsense'
      && github.event.workflow_run.conclusion == 'success'
      && github.event.workflow_run.event == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      id-token: write # TestPyPI trusted publishing (OIDC)
    environment:
      name: testpypi
      url: https://test.pypi.org/project/saltext-opnsense/
    steps:
      - name: Checkout the commit CI just passed on
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.11"

      - name: Install build tools
        run: python -m pip install --upgrade pip build twine

      - name: Build sdist and wheel
        run: python -m build

      - name: Check build artifacts
        run: twine check --strict dist/*

      - name: Show version
        run: ls -1 dist/ >> "$GITHUB_STEP_SUMMARY"

      - name: Publish to TestPyPI
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.0 release/v1
        with:
          repository-url: https://test.pypi.org/legacy/
          skip-existing: true
          verbose: true
          print-hash: true
