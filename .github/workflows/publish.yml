name: Publish to PyPI

# Stable release pipeline. Runs ONLY when a version tag is pushed.
# Flow: full CI test suite + build/verify -> manual approval (pypi environment) -> upload.
# Dev builds go to TestPyPI via publish-dev.yml. See docs/DEVELOPMENT.md.

on:
  push:
    tags:
      - "v*.*.*"

concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  tests:
    name: Test gate
    uses: ./.github/workflows/ci.yml

  build:
    name: Build and verify distribution
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout Repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0

      - name: Require the tagged commit to be on main
        run: |
          git fetch --no-tags origin main
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "::error::Tag $GITHUB_REF_NAME points at a commit that is not on main; refusing to release."
            exit 1
          fi

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.11"

      - name: Install build tools
        run: python -m pip install --upgrade pip build twine packaging

      - name: Build sdist and wheel
        run: python -m build

      - name: Check build artifacts
        run: twine check --strict dist/*

      - name: Require the built version to match the tag
        run: |
          python - <<'PY'
          import os
          import pathlib
          import sys

          from packaging.utils import parse_wheel_filename
          from packaging.version import Version

          tag = Version(os.environ["GITHUB_REF_NAME"].removeprefix("v"))
          wheels = list(pathlib.Path("dist").glob("*.whl"))
          if len(wheels) != 1:
              sys.exit(f"::error::expected exactly one wheel, found {wheels}")
          built = parse_wheel_filename(wheels[0].name)[1]
          print(f"tag={tag} built={built}")
          if built != tag or built.is_devrelease or built.local:
              sys.exit(f"::error::built version {built} does not match tag {tag}")
          PY

      - name: Upload distribution
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: dist
          path: dist/
          if-no-files-found: error
          retention-days: 7

  publish:
    name: Publish to PyPI
    needs: [tests, build]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      id-token: write # PyPI trusted publishing (OIDC)
    # Add required reviewers to this environment so every upload needs approval.
    environment:
      name: pypi
      url: https://pypi.org/project/saltext-opnsense/${{ github.ref_name }}
    steps:
      - name: Download distribution
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: dist
          path: dist/

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.0 release/v1
        with:
          verbose: true
          print-hash: true
