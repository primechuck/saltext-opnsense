name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  docs:
    name: Docs (Sphinx) -W
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.11"
          cache: pip

      - name: Install docs deps
        run: pip install sphinx sphinx_rtd_theme myst-parser

      - name: Build docs with -W
        run: sphinx-build -b html docs docs/_build/html -W -n

  unit:
    name: Unit Tests (Python ${{ matrix.python-version }}, Salt ${{ matrix.salt-version }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14"]
        salt-version: ["3008.3", "latest"]
    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Setup Python ${{ matrix.python-version }}
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install test dependencies
        run: |
          set -e
          if [ "${{ matrix.salt-version }}" = "latest" ]; then
            pip install "salt>=3008" requests coverage pytest pytest-cov
          else
            pip install "salt==${{ matrix.salt-version }}" requests coverage pytest pytest-cov
          fi
          pip install -e . --no-deps

      - name: Unit tests with coverage gate
        run: |
          PYTHONPATH=src pytest tests/unit -q --cov=src/saltext/opnsense --cov-report=term-missing --cov-fail-under=75

      - name: Verify dynamic import injection
        run: PYTHONPATH=src python tools/verify_import.py

  sls-validation:
    name: SLS / Package Validation (salt-call + yamllint)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Setup Python 3.11
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.11"
          cache: pip

      - name: Install salt (stable) + linters
        run: |
          pip install "salt>=3008" jinja2 pyyaml yamllint
          pip install -e . --no-deps
          pip install salt-lint==0.9.2 || echo "salt-lint optional"

      - name: Yamllint SLS tutorials
        run: |
          yamllint docs/tutorials -d "{extends: default, rules:
            {line-length: {max: 120}, truthy: disable,
            braces: disable, brackets: disable}}"


      - name: Validate SLS Jinja + YAML render (strict CI gate)
        run: |
          set -euo pipefail
          python tools/validate_tutorials.py

      - name: Salt-call --local state.show_sls smoke
        run: |
          set -euo pipefail
          mkdir -p /tmp/empty_salt_conf /tmp/ci_pillar_root /tmp/salt-cache /tmp/salt-pki /tmp/salt-root
          cat <<'MINIONCONF' > /tmp/empty_salt_conf/minion
          file_client: local
          id: ci
          cachedir: /tmp/salt-cache
          pki_dir: /tmp/salt-pki
          log_file: /tmp/salt-minion.log
          root_dir: /tmp/salt-root
          minion_id_caching: False
          MINIONCONF
          cat <<'PILLAR' > /tmp/ci_pillar.sls
          opnsense:
            cluster_parent:
              hostname: cluster
              domain: example.com
            aliases:
              example.com:
                - www
                - git
            purge_aliases:
              example.com:
                - old-www
          PILLAR
          cp /tmp/ci_pillar.sls /tmp/ci_pillar_root/top.sls
          S_ARGS="-c /tmp/empty_salt_conf --local"
          S_ARGS="$S_ARGS --file-root=docs/tutorials/states"
          S_ARGS="$S_ARGS --pillar-root=/tmp/ci_pillar_root --retcode-passthrough"
          salt-call $S_ARGS state.show_sls unbound_aliases
          salt-call $S_ARGS state.show_sls acme_certificates

      - name: Python package smoke tests
        run: |
          python -m pip install build -q
          python -m build --wheel --sdist -o /tmp/dist
          python -m pip install /tmp/dist/*.whl -q
          python -c "import saltext.opnsense; print(saltext.opnsense.__file__)"

  version-guard:
    name: Version Guard — <3008 must be rejected
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Setup Python 3.11
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.11"
          cache: pip
      - name: Install salt 3006.27 + extension
        run: |
          pip install "salt==3006.27" requests --quiet
          pip install -e . --no-deps --quiet
      - name: Assert __virtual__ rejects salt<3008
        run: PYTHONPATH=src python tools/check_version_guard_ci.py
      - name: Verify packaging prevents <3008 install
        run: |
          python -m pip install build -q
          python -m build -q
          grep -q "salt>=3008" pyproject.toml
          test ! -f src/saltext/opnsense/proxy/opnsense.py
          test ! -f src/saltext/opnsense/grains/opnsense.py

  spec-drift:
    name: Spec Integrity Check
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Setup Python 3.11
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.11"
          cache: pip
      - name: Install requests
        run: pip install requests
      - name: Verify Spec Consistency
        shell: bash
        run: |
          CORE_REF=$(python3 <<'PY'
          import json, pathlib
          p=pathlib.Path('src/saltext/opnsense/utils/controllers.json')
          print(json.loads(p.read_text()).get('meta',{}).get('core_ref','25.7'))
          PY
          )
          echo "Verifying spec against upstream tag: ${CORE_REF}"
          python tools/generate_spec.py --core-ref "${CORE_REF}"
            --plugins-ref "${CORE_REF}" --output /tmp/controllers.json
          diff -u -I '"generated_at"'
            src/saltext/opnsense/utils/controllers.json /tmp/controllers.json \
            || (echo "controllers.json drift -- run make bump CORE=${CORE_REF}" && exit 1)

  packaging:
    name: Packaging and Types Check
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
      - name: Setup Python 3.11
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.11"
          cache: pip
      - name: Install build tools
        run: pip install build twine
      - name: Build sdist and wheel
        run: python -m build
      - name: Twine check
        run: twine check dist/*
      - name: Check py.typed presence (PEP 561)
        run: |
          test -f src/saltext/opnsense/py.typed && echo "py.typed present" || (echo "py.typed missing" && exit 1)
