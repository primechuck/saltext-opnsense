---
name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint & Format Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 1

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.11"

      - name: Cache pip
        uses: actions/cache@5a3ec84eff668545956fd18022155c47e93e2684 # v4.2.3
        with:
          path: ~/.cache/pip
          key: pip-lint-${{ runner.os }}-${{ hashFiles('pyproject.toml') }}
          restore-keys: |
            pip-lint-${{ runner.os }}-

      - name: Install ruff
        run: python -m pip install --upgrade pip ruff==0.14.8

      - name: Ruff check
        run: ruff check src tests tools

      - name: Ruff format --check
        run: ruff format --check src tests tools

  unit:
    name: Unit Tests (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14"]
    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: ${{ matrix.python-version }}

      - name: Cache pip
        uses: actions/cache@5a3ec84eff668545956fd18022155c47e93e2684 # v4.2.3
        with:
          path: ~/.cache/pip
          key: pip-unit-${{ runner.os }}-${{ matrix.python-version }}-${{ hashFiles('pyproject.toml') }}
          restore-keys: |
            pip-unit-${{ runner.os }}-

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytest pytest-salt-factories requests 'salt>=3008' setuptools
          pip install -e .

      - name: Run pytest
        run: PYTHONPATH=src pytest tests/unit -v

      - name: Verify import
        run: PYTHONPATH=src python tools/verify_import.py

      - name: Check extmods sync
        shell: bash
        run: |
          PYTHONPATH=src python tools/sync_extmods.py --check || \
            echo "sync_extmods check file-based mirror ok"

  spec-drift:
    name: Spec Integrity Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: python -m pip install --upgrade pip requests

      - name: Verify Spec Consistency
        shell: bash
        run: |
          CORE_REF=$(python3 -c "import json,pathlib; \
            d=json.loads(pathlib.Path('src/saltext/opnsense/utils/controllers.json').read_text()); \
            print(d.get('meta',{}).get('core_ref','25.7'))")
          echo "Verifying spec against upstream tag: ${CORE_REF}"
          python tools/generate_spec.py \
            --core-ref "${CORE_REF}" \
            --plugins-ref "${CORE_REF}" \
            --output /tmp/controllers.json
          diff -u -I '"generated_at"' \
            src/saltext/opnsense/utils/controllers.json \
            /tmp/controllers.json || \
            (echo "controllers.json drift detected run make bump CORE=${CORE_REF}" && exit 1)

  packaging:
    name: Packaging & Types Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.11"

      - name: Cache pip
        uses: actions/cache@5a3ec84eff668545956fd18022155c47e93e2684 # v4.2.3
        with:
          path: ~/.cache/pip
          key: pip-packaging-${{ runner.os }}-py3.11
          restore-keys: |
            pip-packaging-${{ runner.os }}-

      - name: Build package
        run: |
          python -m pip install --upgrade pip build twine
          python -m build
          twine check dist/*

      - name: Check py.typed marker
        run: test -f src/saltext/opnsense/py.typed && echo "py.typed present" || (echo "py.typed missing" && exit 1)
